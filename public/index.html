<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inkwell</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
  <link rel="icon" type="image/webp" href="faviicon.webp">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --ink-bg:#0a0a0f;--ink-surface:#12121a;--ink-card:#1a1a26;
      --ink-border:#2a2a3d;--ink-accent:#7f77dd;--ink-accent2:#1d9e75;
      --ink-text:#e8e8f0;--ink-muted:#888890;--ink-dim:#3a3a50;
    }
    body{background:var(--ink-bg);color:var(--ink-text);font-family:'Space Grotesk',sans-serif;padding:2rem 1.5rem;min-height:100vh}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:2.5rem;padding-bottom:1rem;border-bottom:1px solid var(--ink-border)}
    .logo{font-family:'Space Mono',monospace;font-size:1.4rem;font-weight:700;letter-spacing:0.05em}
    .logo span{color:var(--ink-accent)}
    .status-dot{width:8px;height:8px;border-radius:50%;background:var(--ink-accent2);display:inline-block;margin-right:6px;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
    .status{font-size:12px;color:var(--ink-accent2);font-family:'Space Mono',monospace;display:flex;align-items:center}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem}
    @media(max-width:700px){.grid{grid-template-columns:1fr}.insights-grid{grid-template-columns:1fr!important}}
    .card{background:var(--ink-card);border:1px solid var(--ink-border);border-radius:12px;padding:1.5rem}
    .card-label{font-size:11px;font-family:'Space Mono',monospace;color:var(--ink-muted);letter-spacing:0.12em;text-transform:uppercase;margin-bottom:1rem;display:flex;align-items:center;gap:6px}
    .card-label::before{content:'';width:16px;height:1px;background:var(--ink-accent);display:inline-block}
    input,select,textarea{width:100%;background:var(--ink-surface);border:1px solid var(--ink-border);border-radius:8px;padding:0.6rem 0.75rem;color:var(--ink-text);font-family:'Space Grotesk',sans-serif;font-size:14px;outline:none;transition:border-color 0.2s;margin-bottom:0.75rem}
    input:focus,select:focus,textarea:focus{border-color:var(--ink-accent)}
    select option{background:var(--ink-surface)}
    textarea{resize:vertical;min-height:70px}
    .btn{width:100%;padding:0.7rem;border:1px solid var(--ink-accent);border-radius:8px;background:transparent;color:var(--ink-accent);font-family:'Space Mono',monospace;font-size:13px;cursor:pointer;letter-spacing:0.05em;transition:all 0.2s;margin-top:0.25rem}
    .btn:hover{background:var(--ink-accent);color:#fff}
    .insights-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
    .insight-card{background:var(--ink-card);border:1px solid var(--ink-border);border-radius:10px;padding:1rem;text-align:center}
    .insight-val{font-family:'Space Mono',monospace;font-size:1.6rem;font-weight:700;color:var(--ink-accent);margin-bottom:4px}
    .insight-lbl{font-size:11px;color:var(--ink-muted);letter-spacing:0.08em;text-transform:uppercase}
    .book-row{display:flex;justify-content:space-between;align-items:center;padding:0.75rem 0;border-bottom:1px solid var(--ink-dim)}
    .book-row:last-child{border-bottom:none}
    .book-title{font-size:14px;font-weight:500}
    .book-meta{font-size:12px;color:var(--ink-muted);margin-top:2px}
    .badge{font-size:10px;font-family:'Space Mono',monospace;padding:3px 8px;border-radius:4px;letter-spacing:0.05em}
    .badge-reading{background:#1a2a1a;color:var(--ink-accent2);border:1px solid var(--ink-accent2)}
    .badge-finished{background:#1e1a2e;color:var(--ink-accent);border:1px solid var(--ink-accent)}
    .stars{color:var(--ink-accent);font-size:12px}
    .empty{text-align:center;color:var(--ink-muted);font-size:13px;padding:2rem 0;font-family:'Space Mono',monospace}
    .toast{position:fixed;bottom:2rem;right:2rem;background:var(--ink-accent2);color:#fff;padding:0.7rem 1.2rem;border-radius:8px;font-size:13px;font-family:'Space Mono',monospace;display:none;z-index:999}
    .filter-row{display:flex;gap:0.5rem;margin-bottom:1rem}
    .filter-row select{margin-bottom:0;flex:1}
  </style>
</head>
<body>
  <div class="header">
    <div class="logo"><span></span> Inkwell</div>
    <div class="status"><span class="status-dot"></span>api connected</div>
  </div>

  <div class="insights-grid">
    <div class="insight-card"><div class="insight-val" id="i-total">-</div><div class="insight-lbl">total books</div></div>
    <div class="insight-card"><div class="insight-val" id="i-rating">-</div><div class="insight-lbl">avg rating</div></div>
    <div class="insight-card"><div class="insight-val" id="i-genre" style="font-size:1rem;padding-top:0.5rem">-</div><div class="insight-lbl">top genre</div></div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="card-label">log a book</div>
      <input id="title" placeholder="Title" />
      <input id="author" placeholder="Author" />
      <input id="genre" placeholder="Genre" />
      <select id="status">
        <option value="reading">Reading</option>
        <option value="finished">Finished</option>
      </select>
      <input id="rating" type="number" placeholder="Rating (1–5)" min="1" max="5" />
      <textarea id="review" placeholder="Review (optional)"></textarea>
      <button class="btn" onclick="addBook()">+ add to log</button>
    </div>
    <div class="card">
      <div class="card-label">filter log</div>
      <div class="filter-row">
        <select id="f-genre" onchange="loadBooks()">
          <option value="">all genres</option>
          <option>Fiction</option>
          <option>Self Help</option>
          <option>Fantasy</option>
          <option>Biography</option>
          <option>Science</option>
          <option>History</option>
        </select>
        <select id="f-status" onchange="loadBooks()">
          <option value="">all status</option>
          <option value="reading">reading</option>
          <option value="finished">finished</option>
        </select>
      </div>
      <div id="books"><div class="empty">loading books...</div></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const API = "https://inkwell-6h32.onrender.com";

    function showToast(msg){
      const t=document.getElementById('toast');
      t.textContent=msg;t.style.display='block';
      setTimeout(()=>t.style.display='none',2500);
    }

    function stars(n){return n?'★'.repeat(n)+'☆'.repeat(5-n):''}

    async function addBook(){
      const body={
        title:document.getElementById('title').value,
        author:document.getElementById('author').value,
        genre:document.getElementById('genre').value,
        status:document.getElementById('status').value,
        rating:Number(document.getElementById('rating').value)||undefined,
        review:document.getElementById('review').value
      };
      if(!body.title||!body.author||!body.genre){showToast('fill in title, author & genre');return}
      try{
        const r=await fetch(`${API}/books`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        const d=await r.json();
        showToast(`logged: ${d.title}`);
        ['title','author','genre','rating','review'].forEach(id=>document.getElementById(id).value='');
        loadBooks();loadInsights();
      }catch(e){showToast('error — is server running?')}
    }

    async function loadBooks(){
      const genre=document.getElementById('f-genre').value;
      const status=document.getElementById('f-status').value;
      let url=`${API}/books?`;
      if(genre)url+=`genre=${encodeURIComponent(genre)}&`;
      if(status)url+=`status=${status}`;
      try{
        const r=await fetch(url);const books=await r.json();
        const c=document.getElementById('books');
        if(!books.length){c.innerHTML='<div class="empty">no books found</div>';return}
        c.innerHTML=books.map(b=>`
  <div class="book-row" id="row-${b._id}">
    <div style="flex:1">
      <div class="book-title">${b.title}</div>
      <div class="book-meta">${b.author} · ${b.genre} <span class="stars">${stars(b.rating)}</span></div>
      <div id="edit-${b._id}" style="display:none;margin-top:0.5rem;display:none">
        <div style="display:flex;gap:0.5rem;margin-top:0.5rem">
          <select id="s-${b._id}" style="margin-bottom:0;flex:1;padding:0.4rem;font-size:12px">
            <option value="reading" ${b.status==='reading'?'selected':''}>reading</option>
            <option value="finished" ${b.status==='finished'?'selected':''}>finished</option>
          </select>
          <input id="r-${b._id}" type="number" min="1" max="5" placeholder="rating" value="${b.rating||''}" style="margin-bottom:0;width:80px;padding:0.4rem;font-size:12px"/>
          <button class="btn" style="width:auto;padding:0.4rem 0.8rem;font-size:11px" onclick="updateBook('${b._id}')">save</button>
        </div>
      </div>
    </div>
    <div style="display:flex;gap:0.5rem;align-items:center">
      <span class="badge badge-${b.status}">${b.status}</span>
      <button class="btn" style="width:auto;padding:3px 10px;font-size:10px" onclick="toggleEdit('${b._id}')">edit</button>
    </div>
  </div>`).join('');
      }catch(e){document.getElementById('books').innerHTML='<div class="empty">could not reach api</div>'}
    }

    async function loadInsights(){
      try{
        const r=await fetch(`${API}/insights`);const d=await r.json();
        document.getElementById('i-total').textContent=d.totalBooks;
        document.getElementById('i-rating').textContent=d.avgRating;
        document.getElementById('i-genre').textContent=d.mostReadGenre;
      }catch(e){}
    }

    loadBooks();
    loadInsights();
    function toggleEdit(id){
  const el=document.getElementById(`edit-${id}`);
  el.style.display=el.style.display==='none'?'block':'none';
}

async function updateBook(id){
  const status=document.getElementById(`s-${id}`).value;
  const rating=Number(document.getElementById(`r-${id}`).value)||undefined;
  try{
    await fetch(`${API}/books/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,rating})});
    showToast('book updated!');
    loadBooks();loadInsights();
  }catch(e){showToast('update failed')}
}
  </script>
<footer style="text-align:center;padding:2rem 0 1rem;border-top:1px solid var(--ink-border);margin-top:2rem;font-family:'Space Mono',monospace;font-size:11px;color:var(--ink-muted);letter-spacing:0.08em;">
  crafted by disha &nbsp;·&nbsp; opencode summer task
</footer>
</body>
</html>
